<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f0f0f0;
        text-align: center;
      }

      .calculadora {
        background-color: white;
        width: 280px;
        padding: 20px;
        margin: 80px auto;
        border-radius: 10px;
        box-shadow: 0 2px 10px #ccc;
      }

      input {
        width: 90%;
        padding: 10px;
        font-size: 22px;
        margin-bottom: 15px;
        text-align: right;
        border: 1px solid #ccc;
        border-radius: 5px;
      }

      button {
        width: 55px;
        height: 45px;
        margin: 4px;
        font-size: 18px;
        border: none;
        border-radius: 5px;
        background-color: #e5e5e5;
        cursor: pointer;
      }

      button:hover {
        background-color: #ccc;
      }

      .operador {
        background-color: #90c2f5;
      }

      .limpiar {
        background-color: #f58f8f;
      }

      .igual {
        background-color: #76d7a3;
      }
    </style>
  </head>
  <body>
    <div class="calculadora">
      <h1>Calculadora</h1>

      <input type="text" id="pantalla" placeholder="0" readonly />

      <div>
        <button class="limpiar" onclick="limpiar()">C</button>
        <button onclick="agregar('(')">(</button>
        <button onclick="agregar(')')">)</button>
        <button class="operador" onclick="agregar('/')">÷</button>
      </div>

      <div>
        <button onclick="agregar('7')">7</button>
        <button onclick="agregar('8')">8</button>
        <button onclick="agregar('9')">9</button>
        <button class="operador" onclick="agregar('*')">×</button>
      </div>

      <div>
        <button onclick="agregar('4')">4</button>
        <button onclick="agregar('5')">5</button>
        <button onclick="agregar('6')">6</button>
        <button class="operador" onclick="agregar('-')">-</button>
      </div>

      <div>
        <button onclick="agregar('1')">1</button>
        <button onclick="agregar('2')">2</button>
        <button onclick="agregar('3')">3</button>
        <button class="operador" onclick="agregar('+')">+</button>
      </div>

      <div>
        <button onclick="agregar('0')">0</button>
        <button onclick="agregar('.')">.</button>
        <button class="igual" onclick="calcular()">=</button>
      </div>
    </div>

    <script>
      function agregar(valor) {
        document.getElementById("pantalla").value += valor;
      }

      function limpiar() {
        document.getElementById("pantalla").value = "";
      }
      function calcular() {
        const pantalla = document.getElementById("pantalla");
        try {
          pantalla.value = evaluar(pantalla.value);
        } catch (e) {
          pantalla.value = "Error";
        }
      }

      function evaluar(texto) {
        const tokens = texto.match(/\d+\.?\d*|\.\d+|[+\-()]/g) || [];
        let pos = 0;

        function expresion() {
          let total = termino();
          while (tokens[pos] === "+" || tokens[pos] === "-") {
            const operador = tokens[pos++];
            const derecho = termino();
            total = operador === "+" ? total + derecho : total - derecho;
          }
          return total;
        }

        function termino() {
          const token = tokens[pos++];

          if (token === "(") {
            const valor = expresion();
            if (tokens[pos++] !== ")") throw new Error("Falta cerrar )");
            return valor;
          }

          const numero = parseFloat(token);
          if (isNaN(numero)) throw new Error("Se esperaba un número");
          return numero;
        }

        const resultado = expresion();
        if (pos < tokens.length) throw new Error("Símbolos sobrantes");
        return resultado;
      }
    </script>
  </body>
</html>
